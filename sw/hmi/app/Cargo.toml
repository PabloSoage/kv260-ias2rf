[package]
name = "kria-hmi"
description = "The in-car screens (HMI.md): a Slint application, native on the KV260 (Linux KMS) or a PC, and in a browser (WebAssembly); it draws kria-hmid's snapshots and sends its commands"
version = "0.1.0"
edition = "2021"
# The screens' source is MIT like the rest of sw/kria; a built binary links Slint, so it is distributed under
# Slint's terms: GPL-3.0 on an embedded device such as the KV260 (docs/HMI.md §5).
license = "MIT"
build = "build.rs"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "kria-hmi"
path = "src/main.rs"

[dependencies]
serde_json = "1"
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-path", "software-renderer-systemfonts"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
png = "0.17"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "linux")))'.dependencies]
slint = { version = "1.19", default-features = false, features = ["backend-winit", "renderer-femtovg"] }

[target.'cfg(target_os = "linux")'.dependencies]
# on the KV260: straight to DRM/KMS, no desktop; the software renderer always works, femtovg uses the Mali-400
slint = { version = "1.19", default-features = false, features = ["backend-linuxkms-noseat", "renderer-femtovg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { version = "1.19", default-features = false, features = ["backend-winit", "renderer-femtovg"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "Window", "Location", "BinaryType"] }
console_error_panic_hook = "0.1"

[build-dependencies]
slint-build = "1.19"

[profile.release]
opt-level = "s"
lto = true
