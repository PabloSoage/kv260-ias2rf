<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HMI wideband</title>
<script src="./support.js"></script>
<!-- written by kria-sdrd hackrf-post (sw/kria/sdr) from the end-to-end run: kria_sweep's bins on the panorama -->
<script src="./data/hackrf_sweep.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E6EDF3;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #0B0F14; color: #E6EDF3; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1px solid #243243">
    <div style="font-size: 22px; font-weight: 700; letter-spacing: 0.02em">IAS2RF</div>
    <div style="font-size: 16px; color: #9FB0C0">Wideband · HackRF Pro sweep</div>
    <div style="flex-grow: 1"></div>
    <div style="font-size: 15px; color: #9FB0C0">{{cov}}</div>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 14px 24px; min-height: 0">
    <div style="background: #121A23; border: 1px solid #243243; border-radius: 12px; padding: 8px 8px 4px 8px">
      <svg width="100%" height="230" viewBox="0 0 1200 230" preserveAspectRatio="none" role="img" aria-label="Panorama 0 to 7.2 GHz">
        <rect x="0" y="0" width="{{boardw}}" height="200" fill="rgba(107,213,143,0.07)"></rect>
        <rect x="{{boardw}}" y="0" width="{{hackw}}" height="200" fill="rgba(90,176,255,0.06)"></rect>
        <line x1="0" y1="50" x2="1200" y2="50" stroke="#1E2A37"></line>
        <line x1="0" y1="100" x2="1200" y2="100" stroke="#1E2A37"></line>
        <line x1="0" y1="150" x2="1200" y2="150" stroke="#1E2A37"></line>
        <polyline points="{{trace}}" fill="none" stroke="#5AB0FF" stroke-width="1.3"></polyline>
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="8">
          <text x="{{t.x}}" y="222" fill="#9FB0C0" font-size="14" text-anchor="middle">{{t.l}}</text>
        </sc-for>
        <text x="8" y="18" fill="#6BD58F" font-size="14">this board: HF, VHF/UHF to 1.1 GHz</text>
        <text x="8" y="196" fill="#9FB0C0" font-size="13">dBFS: top −5, lines every 17.5 dB</text>
        <text x="{{hacklx}}" y="40" fill="#5AB0FF" font-size="14">HackRF Pro adds 1.1 to 7.1 GHz, RX and TX</text>
      </svg>
    </div>

    <div style="flex-grow: 1; display: flex; gap: 14px; min-height: 0">
      <div style="flex: 1 1 0; background: #121A23; border: 1px solid #243243; border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <span style="font-size: 14px; color: #9FB0C0; text-transform: uppercase; letter-spacing: 0.08em">Strongest signals</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; row-gap: 4px; font-size: 16px">
          <sc-for list="{{sig}}" as="s" hint-placeholder-count="12">
            <div style="display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid #1E2A37; padding: 3px 0">
              <span style="font-family: 'JetBrains Mono', monospace">{{s.f}}</span>
              <span style="color: #9FB0C0">{{s.bw}}</span>
              <span style="font-family: 'JetBrains Mono', monospace">{{s.p}}</span>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="width: 360px; display: flex; flex-direction: column; gap: 10px">
        <div style="background: #121A23; border: 1px solid #243243; border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 14px; color: #9FB0C0; text-transform: uppercase; letter-spacing: 0.08em">Transmit gate (R5F 0 interlock + licence bands)</span>
          <sc-for list="{{tx}}" as="t" hint-placeholder-count="4">
            <div style="display: flex; justify-content: space-between; font-size: 15px">
              <span style="font-family: 'JetBrains Mono', monospace">{{t.f}}</span>
              <span style="{{t.style}}">{{t.s}}</span>
            </div>
          </sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <button type="button" style="height: 56px; border-radius: 12px; background: #182330; border: 1px solid #36485C; color: #E6EDF3; font-family: inherit; font-size: 17px">Hold</button>
          <a href="Spectrum.dc.html" style="height: 56px; border-radius: 12px; background: #F5A524; color: #14100A; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Tune here</a>
        </div>
      </div>
    </div>
  </main>

  <nav aria-label="Screens" style="height: 88px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); border-top: 1px solid #243243; background: #0E141B">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
      <a href="{{n.href}}" style="{{n.style}}">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <span style="font-size: 14px">{{n.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      ['Home', 'Main.dc.html', 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],
      ['Vehicle', 'Vehicle.dc.html', 'M3 13l2-6h14l2 6v5h-3v-2H6v2H3zM7 13h2M15 13h2'],
      ['Radio', 'Radio.dc.html', 'M4 9h16v11H4zM8 4l8 5M8 14h2M14 14a2 2 0 1 0 4 0a2 2 0 1 0-4 0'],
      ['Spectrum', 'Spectrum.dc.html', 'M3 20h18M4 16l3-7 3 5 3-9 3 8 2-3 2 6'],
      ['Wideband', 'Wideband.dc.html', 'M2 12h3l2-6 3 12 3-9 2 5 2-2h5'],
      ['Bearing', 'Bearing.dc.html', 'M12 21a9 9 0 1 0 0-18a9 9 0 1 0 0 18M12 7l3 8-3-2-3 2z'],
      ['ADS-B', 'Adsb.dc.html', 'M12 2l2 7 7 3-7 2-2 8-2-8-7-2 7-3z'],
      ['Radar', 'Radar.dc.html', 'M12 12l7-7M12 3a9 9 0 1 0 9 9M12 7a5 5 0 1 0 5 5'],
      ['Transmit', 'Transmit.dc.html', 'M12 13v8M8 21h8M12 13a2 2 0 1 0 0-4a2 2 0 1 0 0 4M7 6a7 7 0 0 0 0 10M17 6a7 7 0 0 1 0 10'],
      ['System', 'System.dc.html', 'M12 15a3 3 0 1 0 0-6a3 3 0 1 0 0 6M19 12h2M3 12h2M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4']
    ];
    const nav = items.map(([label, href, icon]) => ({ label, href, icon,
      style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; ' +
        (label === 'Wideband' ? 'color: #F5A524; background: #1A1710; border-top: 3px solid #F5A524' : 'color: #9FB0C0; border-top: 3px solid transparent') }));
    const H = window.HACKRF_SWEEP;
    const FMAX = 7200, W = 1200, TOP = -5, BOT = -75;
    const tr = H.trace_db.slice(0, FMAX);
    const step = FMAX / W;
    let pts = [];
    for (let x = 0; x < W; x++) {
      let m = -150;
      for (let k = Math.floor(x * step); k < Math.floor((x + 1) * step); k++) if (tr[k] !== undefined) m = Math.max(m, tr[k]);
      const y = 200 * (TOP - Math.max(BOT, Math.min(TOP, m))) / (TOP - BOT);
      pts.push(x + ',' + y.toFixed(1));
    }
    const ticks = [500, 1000, 2000, 3000, 4000, 5000, 6000, 7000].map((f) => ({ x: (f / FMAX * W).toFixed(0), l: (f / 1000) + ' GHz' }));
    const fmt = (hz) => hz >= 1e9 ? (hz / 1e9).toFixed(4) + ' GHz' : (hz / 1e6).toFixed(2) + ' MHz';
    const sig = H.signals.slice(0, 12).map((s) => ({ f: fmt(s.f), bw: (s.bw / 1e6).toFixed(1) + ' MHz', p: s.dbfs.toFixed(0) + ' dBFS' }));
    const names = { Keyed: 'keyed', BlockedInterlock: 'blocked: interlock', BlockedBand: 'blocked: out of band' };
    const tx = H.tx.map((t) => ({ f: (t.f / 1e6).toFixed(1) + ' MHz' + (t.interlock ? '' : ', moving'), s: names[t.state],
      style: 'font-weight: 600; color: ' + (t.state === 'Keyed' ? '#6BD58F' : '#FF7B72') }));
    const boardw = (1100 / FMAX * W).toFixed(0);
    return { nav, trace: pts.join(' '), ticks, sig, tx, boardw, hackw: ((7100 - 1100) / FMAX * W).toFixed(0),
      hacklx: (+boardw + 8).toString(), cov: (H.covered * 100).toFixed(1) + ' % of 0 to 7.25 GHz each sweep · 78 kHz bins · FFT in the PL' };
  }
}
</script>
</body>
</html>
