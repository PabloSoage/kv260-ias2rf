<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HMI system</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E6EDF3;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #0B0F14; color: #E6EDF3; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1px solid #243243">
    <div style="font-size: 22px; font-weight: 700; letter-spacing: 0.02em">IAS2RF</div>
    <div style="font-size: 16px; color: #9FB0C0">System</div>
    <div style="flex-grow: 1"></div>
    <span style="padding: 6px 12px; border-radius: 16px; background: #13261D; color: #7EE2B0; font-size: 14px">All nominal</span>
  </header>

  <main style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding: 16px 24px; align-content: start">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
      <div style="background: #121A23; border: 1px solid #243243; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-height: 196px; box-sizing: border-box">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-size: 14px; color: #9FB0C0; text-transform: uppercase; letter-spacing: 0.08em">{{c.title}}</span>
          <span style="{{c.dot}}" aria-label="{{c.state}}" role="img"></span>
        </div>
        <sc-for list="{{c.rows}}" as="r" hint-placeholder-count="4">
          <div style="display: flex; justify-content: space-between; gap: 8px; font-size: 16px">
            <span style="color: #C3CFDA">{{r.k}}</span><span style="font-family: 'JetBrains Mono', monospace">{{r.v}}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </main>

  <nav aria-label="Screens" style="height: 88px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); border-top: 1px solid #243243; background: #0E141B">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
      <a href="{{n.href}}" style="{{n.style}}">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <span style="font-size: 14px">{{n.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      ['Home', 'Main.dc.html', 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],
      ['Vehicle', 'Vehicle.dc.html', 'M3 13l2-6h14l2 6v5h-3v-2H6v2H3zM7 13h2M15 13h2'],
      ['Radio', 'Radio.dc.html', 'M4 9h16v11H4zM8 4l8 5M8 14h2M14 14a2 2 0 1 0 4 0a2 2 0 1 0-4 0'],
      ['Spectrum', 'Spectrum.dc.html', 'M3 20h18M4 16l3-7 3 5 3-9 3 8 2-3 2 6'],
      ['ADS-B', 'Adsb.dc.html', 'M12 2l2 7 7 3-7 2-2 8-2-8-7-2 7-3z'],
      ['Radar', 'Radar.dc.html', 'M12 12l7-7M12 3a9 9 0 1 0 9 9M12 7a5 5 0 1 0 5 5'],
      ['Transmit', 'Transmit.dc.html', 'M12 13v8M8 21h8M12 13a2 2 0 1 0 0-4a2 2 0 1 0 0 4M7 6a7 7 0 0 0 0 10M17 6a7 7 0 0 1 0 10'],
      ['System', 'System.dc.html', 'M12 15a3 3 0 1 0 0-6a3 3 0 1 0 0 6M19 12h2M3 12h2M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4']
    ];
    const nav = items.map(([label, href, icon]) => ({ label, href, icon,
      style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; ' +
        (label === 'System' ? 'color: #F5A524; background: #1A1710; border-top: 3px solid #F5A524' : 'color: #9FB0C0; border-top: 3px solid transparent') }));
    const ok = 'width: 14px; height: 14px; border-radius: 7px; background: #4CC38A';
    const info = 'width: 14px; height: 14px; border-radius: 7px; background: #5AB0FF';
    const C = [
      ['IAS1 link', ok, 'OK', [['Uplink', '2 × 1 Gb/s'], ['Downlink', '1 Gb/s'], ['Eye margin', '41 taps'], ['CRC errors', '0']]],
      ['Clocks', ok, 'OK', [['Master', '400 MHz'], ['Si549', 'locked'], ['ADC DCOs', 'trained'], ['Mode switch', 'ready']]],
      ['Temperatures', ok, 'OK', [['Artix-7', '58 °C'], ['K26', '52 °C'], ['Board', '44 °C'], ['Fan', '42 %']]],
      ['Front end', ok, 'OK', [['RFFC5072', 'locked'], ['PE4312', '12 dB'], ['LNA', 'on'], ['AGC', 'auto']]],
      ['A53 cluster', info, 'Running', [['Load', '38 %'], ['GPU', 'Mali-400'], ['Display', 'HDMI 720p'], ['Linux', 'up 2 h 14 m']]],
      ['R5F real time', info, 'Running', [['Core 0', 'control loop'], ['Core 1', 'radar sched.'], ['Loop', '1 kHz'], ['Overruns', '0']]],
      ['Recording', info, 'Idle', [['VCU', 'H.265 ready'], ['IQ to SSD', 'off'], ['Free', '212 GB'], ['Camera', 'pass-through']]],
      ['Settings', info, 'Info', [['Theme', 'night'], ['TX licence', 'not set'], ['Units', 'metric'], ['Position', 'GPS']]]
    ];
    const cards = C.map(([title, dot, state, rows]) => ({ title, dot, state, rows: rows.map(([k, v]) => ({ k, v })) }));
    return { nav, cards };
  }
}
</script>
</body>
</html>
