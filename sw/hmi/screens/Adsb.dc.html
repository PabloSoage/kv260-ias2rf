<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HMI ADS-B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E6EDF3;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #0B0F14; color: #E6EDF3; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1px solid #243243">
    <div style="font-size: 22px; font-weight: 700; letter-spacing: 0.02em">IAS2RF</div>
    <div style="font-size: 16px; color: #9FB0C0">ADS-B 1090 MHz</div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; gap: 8px; font-size: 14px">
      <span style="padding: 6px 12px; border-radius: 16px; background: #182330; color: #9FB0C0">CRC good 412 · bad 9</span>
      <span style="padding: 6px 12px; border-radius: 16px; background: #182330; color: #9FB0C0">Own position: GPS fix</span>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; gap: 16px; padding: 16px 24px; min-height: 0">
    <section style="width: 520px; background: #121A23; border: 1px solid #243243; border-radius: 16px; display: flex; align-items: center; justify-content: center">
      <svg width="500" height="500" viewBox="-250 -250 500 500" role="img" aria-label="Aircraft around own position, rings at 25, 50 and 100 km">
        <circle r="235" fill="none" stroke="#243243"></circle>
        <circle r="117" fill="none" stroke="#243243"></circle>
        <circle r="59" fill="none" stroke="#243243"></circle>
        <line x1="-240" y1="0" x2="240" y2="0" stroke="#1E2A37"></line>
        <line x1="0" y1="-240" x2="0" y2="240" stroke="#1E2A37"></line>
        <text x="4" y="-238" fill="#9FB0C0" font-size="13">N</text>
        <text x="4" y="74" fill="#6F8193" font-size="12">25</text>
        <text x="4" y="132" fill="#6F8193" font-size="12">50</text>
        <text x="4" y="230" fill="#6F8193" font-size="12">100 km</text>
        <polygon points="0,-9 6,7 0,3 -6,7" fill="#F5A524"></polygon>
        <sc-for list="{{ac}}" as="a" hint-placeholder-count="7">
          <g transform="{{a.tf}}">
            <line x1="0" y1="0" x2="{{a.hx}}" y2="{{a.hy}}" stroke="{{a.col}}" stroke-width="2"></line>
            <circle r="6" fill="{{a.col}}"></circle>
            <text x="10" y="-8" fill="#E6EDF3" font-size="13" font-family="JetBrains Mono, monospace">{{a.cs}}</text>
            <text x="10" y="7" fill="#9FB0C0" font-size="12" font-family="JetBrains Mono, monospace">{{a.fl}}</text>
          </g>
        </sc-for>
      </svg>
    </section>

    <section style="flex: 1 1 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <div style="display: grid; grid-template-columns: 1.3fr 0.9fr 1fr 0.9fr 0.9fr 0.8fr; gap: 8px; padding: 0 16px; font-size: 14px; color: #9FB0C0; text-transform: uppercase; letter-spacing: 0.06em">
        <span>Callsign</span><span>Level</span><span>Speed</span><span>Track</span><span>Range</span><span>Seen</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <button type="button" onClick="{{r.pick}}" style="{{r.style}}">
          <span style="font-weight: 700">{{r.cs}}</span><span>{{r.fl}}</span><span>{{r.gs}}</span><span>{{r.trk}}</span><span>{{r.rng}}</span><span style="color: #9FB0C0">{{r.seen}}</span>
        </button>
      </sc-for>
      <div style="font-size: 14px; color: #9FB0C0; margin-top: auto">Decoded in the PL (kria_adsb_rx, four chip phases, CRC); positions by CPR decoding on the A53s. Ranges need the own position from the GPS input.</div>
    </section>
  </main>

  <nav aria-label="Screens" style="height: 88px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); border-top: 1px solid #243243; background: #0E141B">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="8">
      <a href="{{n.href}}" style="{{n.style}}">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        <span style="font-size: 14px">{{n.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 0 }; }
  renderVals() {
    const items = [
      ['Home', 'Main.dc.html', 'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z'],
      ['Vehicle', 'Vehicle.dc.html', 'M3 13l2-6h14l2 6v5h-3v-2H6v2H3zM7 13h2M15 13h2'],
      ['Radio', 'Radio.dc.html', 'M4 9h16v11H4zM8 4l8 5M8 14h2M14 14a2 2 0 1 0 4 0a2 2 0 1 0-4 0'],
      ['Spectrum', 'Spectrum.dc.html', 'M3 20h18M4 16l3-7 3 5 3-9 3 8 2-3 2 6'],
      ['ADS-B', 'Adsb.dc.html', 'M12 2l2 7 7 3-7 2-2 8-2-8-7-2 7-3z'],
      ['Radar', 'Radar.dc.html', 'M12 12l7-7M12 3a9 9 0 1 0 9 9M12 7a5 5 0 1 0 5 5'],
      ['Transmit', 'Transmit.dc.html', 'M12 13v8M8 21h8M12 13a2 2 0 1 0 0-4a2 2 0 1 0 0 4M7 6a7 7 0 0 0 0 10M17 6a7 7 0 0 1 0 10'],
      ['System', 'System.dc.html', 'M12 15a3 3 0 1 0 0-6a3 3 0 1 0 0 6M19 12h2M3 12h2M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4']
    ];
    const nav = items.map(([label, href, icon]) => ({ label, href, icon,
      style: 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; ' +
        (label === 'ADS-B' ? 'color: #F5A524; background: #1A1710; border-top: 3px solid #F5A524' : 'color: #9FB0C0; border-top: 3px solid transparent') }));
    const A = [
      { cs: 'IBE3471', fl: 'FL120', gs: '310 kt', trk: 245, rng: 18, brg: 40, seen: '1 s' },
      { cs: 'VLG8213', fl: 'FL340', gs: '452 kt', trk: 30, rng: 47, brg: 300, seen: '2 s' },
      { cs: 'RYR92QP', fl: 'FL370', gs: '468 kt', trk: 190, rng: 72, brg: 160, seen: '1 s' },
      { cs: 'AEA1052', fl: 'FL220', gs: '388 kt', trk: 80, rng: 33, brg: 230, seen: '4 s' },
      { cs: 'EC-NQX', fl: '3500 ft', gs: '105 kt', trk: 320, rng: 9, brg: 110, seen: '2 s' },
      { cs: 'TAP1094', fl: 'FL390', gs: '471 kt', trk: 15, rng: 91, brg: 20, seen: '6 s' },
      { cs: 'BAW7KC', fl: 'FL360', gs: '455 kt', trk: 200, rng: 64, brg: 75, seen: '3 s' }
    ];
    const pr = (km) => km <= 25 ? km / 25 * 59 : km <= 50 ? 59 + (km - 25) / 25 * 58 : 117 + (km - 50) / 50 * 118;
    const ac = A.map((a, i) => { const r = pr(a.rng), b = a.brg * Math.PI / 180, t = a.trk * Math.PI / 180;
      return { cs: a.cs, fl: a.fl, tf: 'translate(' + (r * Math.sin(b)).toFixed(1) + ',' + (-r * Math.cos(b)).toFixed(1) + ')',
        hx: (18 * Math.sin(t)).toFixed(1), hy: (-18 * Math.cos(t)).toFixed(1), col: i === this.state.sel ? '#F5A524' : '#5AB0FF' }; });
    const rows = A.map((a, i) => ({ cs: a.cs, fl: a.fl, gs: a.gs, trk: a.trk + '°', rng: a.rng + ' km', seen: a.seen, pick: () => this.setState({ sel: i }),
      style: 'display: grid; grid-template-columns: 1.3fr 0.9fr 1fr 0.9fr 0.9fr 0.8fr; gap: 8px; align-items: center; min-height: 56px; padding: 0 16px; border-radius: 12px; font-family: "JetBrains Mono", monospace; font-size: 18px; text-align: left; color: #E6EDF3; ' +
        (i === this.state.sel ? 'background: #1A1710; border: 2px solid #F5A524' : 'background: #121A23; border: 1px solid #243243') }));
    return { nav, ac, rows };
  }
}
</script>
</body>
</html>
