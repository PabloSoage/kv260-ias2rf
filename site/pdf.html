<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KV260-IAS2RF | PDF Documentation Reader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffb020'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='14' font-weight='bold' text-anchor='middle' fill='%230b0d10'%3EPDF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    .pdf-shell { display: flex; flex-direction: column; height: 100vh; }
    .pdf-bar {
      display: flex; align-items: center; gap: 8px; padding: 7px 12px;
      background: var(--bg-elev); border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .pdf-main { display: grid; grid-template-columns: 270px minmax(0, 1fr); flex: 1; min-height: 0; }
    .pdf-main.toc-closed { grid-template-columns: minmax(0, 1fr); }
    .pdf-toc {
      background: var(--bg-elev); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px;
    }
    .pdf-main.toc-closed .pdf-toc { display: none; }
    .pdf-toc-btn {
      text-align: left; background: transparent; border: 1px solid transparent; border-radius: 5px;
      padding: 4px 6px; font-size: 11px; color: var(--text); cursor: pointer;
      display: flex; justify-content: space-between; gap: 6px;
    }
    .pdf-toc-btn:hover { background: var(--bg-panel); border-color: var(--border); }
    .pdf-toc-btn.sub { padding-left: 16px; color: var(--text-muted); font-size: 10.5px; }
    .pdf-pages {
      overflow-y: auto; background: #12161c; padding: 14px 10px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .pdf-page-slot {
      background: #fff; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      border-radius: 3px; position: relative; overflow: hidden; flex-shrink: 0;
    }
    .pdf-page-slot canvas { display: block; width: 100%; height: auto; }
    .pdf-page-badge {
      position: absolute; top: 6px; right: 8px; background: rgba(11, 13, 16, 0.72);
      color: #e6edf3; font-family: var(--font-mono); font-size: 10px; padding: 2px 6px; border-radius: 4px;
    }
    .pdf-num-in {
      width: 58px; background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text); border-radius: 5px; padding: 4px 6px; font-family: var(--font-mono); font-size: 12px;
      text-align: center;
    }
    @media (max-width: 820px) {
      .pdf-main { grid-template-columns: minmax(0, 1fr); position: relative; }
      .pdf-toc {
        position: absolute; top: 0; left: 0; bottom: 0; width: 260px; z-index: 30;
        box-shadow: var(--shadow);
      }
      .pdf-pages { padding: 8px 6px; gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="pdf-shell">
    <header class="pdf-bar">
      <a class="btn btn-sm" href="./" title="Back to 3-D Explorer">&larr; 3-D Site</a>
      <button id="btn-toc" class="btn btn-sm" type="button">Outline</button>
      <select id="sel-pdf" class="sim-select" style="width:auto;max-width:250px;" aria-label="Select document">
        <option value="docs/KV260-IAS2RF_Documentation.pdf">Documentation Book (26 MB)</option>
        <option value="docs/KV260-IAS2RF_layout.pdf">8-Layer Layout (10.5 MB)</option>
        <option value="docs/KV260-IAS2RF_schematic.pdf">Schematic (0.7 MB)</option>
      </select>
      <div style="display:flex;align-items:center;gap:4px;">
        <button id="btn-prev" class="btn btn-sm" type="button">Prev</button>
        <input id="inp-page" class="pdf-num-in" type="number" min="1" value="1" aria-label="Current page">
        <span id="lbl-pages" class="mono" style="font-size:11px;color:var(--text-muted)">/ -</span>
        <button id="btn-next" class="btn btn-sm" type="button">Next</button>
      </div>
      <div style="display:flex;align-items:center;gap:4px;">
        <button id="btn-zout" class="btn btn-sm" type="button">-</button>
        <button id="btn-zfit" class="btn btn-sm" type="button">Fit</button>
        <button id="btn-zin" class="btn btn-sm" type="button">+</button>
      </div>
      <span id="pdf-status" class="mono" style="font-size:11px;color:var(--cyan);margin-left:auto;">Streaming PDF.js (Apache-2.0)...</span>
      <a id="btn-raw" class="btn btn-sm" href="docs/KV260-IAS2RF_Documentation.pdf" download>Download</a>
    </header>

    <div id="pdf-main" class="pdf-main">
      <aside id="pdf-toc" class="pdf-toc" aria-label="Document Outline">
        <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;">Bookmarks &amp; Sections</div>
        <div id="toc-list" style="display:flex;flex-direction:column;gap:3px;"></div>
      </aside>
      <div id="pdf-pages" class="pdf-pages" tabindex="0"></div>
    </div>
  </div>
  <script type="module" src="pdf_viewer.js"></script>
</body>
</html>
