[package]
name = "ias2rf-site-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust/WASM core for KV260-IAS2RF web explorer: spatial picking, search, net graph lookup and mock-up simulations"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true
