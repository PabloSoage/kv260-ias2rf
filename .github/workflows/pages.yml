name: Deploy GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Fetch the documentation PDFs from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/docs
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "KV260-IAS2RF_*.pdf" --dir site/docs
          ls -l site/docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
